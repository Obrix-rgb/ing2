<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yüreğir Halıcılar AHL · Presentation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/fraunces@5.1.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/fraunces@5.1.0/wght-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo@5.1.0/index.css">
<style>
  :root{
    --paper:#F4EEE4; --ink:#16130F; --oxide:#B5472B; --forest:#14382F;
    --mustard:#D9A227; --line:rgba(22,19,15,.16); --soft:rgba(22,19,15,.55);
    --bar:#1B1815; --barline:#2C2723; --barfg:#B9AE9F;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;height:100%}
  body{background:var(--bar);font-family:'Archivo Variable',Archivo,'Segoe UI',Arial,sans-serif;
    color:var(--ink);overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}

  /* ---------- sahne ---------- */
  .stage{position:fixed;left:0;right:0;top:0;bottom:64px;display:flex;align-items:center;
    justify-content:center;overflow:hidden}
  .box{position:relative;flex:none;overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
  .deck{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:top left;
    background:var(--paper)}

  .slide{position:absolute;inset:0;padding:54px 64px 58px;background:var(--paper);
    opacity:0;visibility:hidden;transform:translateY(16px);
    transition:opacity .4s ease,transform .4s ease,visibility .4s}
  .slide.on{opacity:1;visibility:visible;transform:none;z-index:2}
  .slide::before{content:'';position:absolute;inset:20px;border:1px solid var(--line);pointer-events:none}
  .slide.dark{background:var(--forest);color:#EFE8DB}
  .slide.dark::before{border-color:rgba(239,232,219,.22)}

  .slabel{display:flex;align-items:center;gap:11px;font-size:10.5px;letter-spacing:2.7px;
    text-transform:uppercase;font-weight:700;color:var(--oxide)}
  .slabel i{width:22px;height:1px;background:var(--oxide);display:block}
  .dark .slabel{color:#E8B9A5}
  .dark .slabel i{background:#E8B9A5}

  h2.h{font-family:'Fraunces Variable',Georgia,serif;font-weight:600;font-size:50px;line-height:1.02;
    letter-spacing:-1px;margin:20px 0 0;color:var(--ink)}
  h2.h em{font-style:italic;color:var(--oxide);font-weight:500}
  .dark h2.h{color:#F3EDE1}
  .sub{font-family:'Fraunces Variable',Georgia,serif;font-style:italic;font-size:17px;
    color:var(--soft);margin:12px 0 0}
  .dark .sub{color:rgba(243,237,225,.62)}

  .pg{position:absolute;right:64px;bottom:28px;font-family:'Fraunces Variable',Georgia,serif;
    font-size:14px;letter-spacing:1.2px;color:rgba(22,19,15,.42)}
  .pg b{color:var(--oxide);font-weight:600}
  .dark .pg{color:rgba(243,237,225,.5)}
  .dark .pg b{color:#E8B9A5}
  .src{position:absolute;left:64px;bottom:28px;font-size:10px;letter-spacing:1.4px;
    text-transform:uppercase;color:rgba(22,19,15,.38);font-weight:600}
  .dark .src{color:rgba(243,237,225,.4)}

  /* ---------- 1 ---------- */
  .cover{padding:0}
  .cover .grid{position:absolute;left:64px;top:78px;width:700px}
  .cover .stamp{display:flex;align-items:flex-start;gap:14px}
  .cover .stamp .sq{width:13px;height:13px;background:var(--oxide);flex:none;margin-top:3px}
  .cover .stamp .mt{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;
    color:rgba(239,232,219,.72);line-height:1.75;font-weight:600}
  .cover .stamp .mt b{display:block;color:#fff;letter-spacing:2.6px;font-size:11px}
  .cover h1{font-family:'Fraunces Variable',Georgia,serif;font-weight:600;font-size:76px;
    line-height:.99;letter-spacing:-2.2px;margin:46px 0 0;color:#F6F0E4}
  .cover h1 em{font-style:italic;font-weight:500;color:#E8B9A5}
  .cover .rl{width:74px;height:2px;background:var(--oxide);margin:34px 0 0}
  .cover .sn{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#F6F0E4;
    font-weight:700;margin-top:20px}
  .cover .sn2{font-size:10px;letter-spacing:2.6px;text-transform:uppercase;
    color:rgba(239,232,219,.55);margin-top:9px;font-weight:600}
  .cover .yr{position:absolute;right:64px;top:74px;text-align:right}
  .cover .yr .a{font-family:'Fraunces Variable',Georgia,serif;font-size:19px;color:#EFE8DB;letter-spacing:1px}
  .cover .yr .b{font-size:9.5px;letter-spacing:2.6px;text-transform:uppercase;
    color:rgba(239,232,219,.5);margin-top:7px;font-weight:600}
  .cover .art{position:absolute;right:-40px;bottom:-30px;width:430px;height:430px}
  .cover .art svg{width:100%;height:100%}
  .cover .hint{position:absolute;left:64px;bottom:30px;font-size:9.5px;letter-spacing:1.6px;
    text-transform:uppercase;color:rgba(239,232,219,.34);font-weight:600}

  /* ---------- 2 ---------- */
  .n4{display:grid;grid-template-columns:repeat(4,1fr);margin-top:52px;border-top:2px solid var(--ink)}
  .n4 .it{padding:26px 24px 0 0;border-right:1px solid var(--line)}
  .n4 .it:last-child{border-right:0}
  .n4 .v{font-family:'Fraunces Variable',Georgia,serif;font-weight:600;font-size:104px;
    line-height:.84;letter-spacing:-4px;display:block}
  .n4 .l{display:block;margin-top:20px;font-size:10.5px;letter-spacing:2.1px;
    text-transform:uppercase;font-weight:700;color:var(--soft)}
  .n4 .n{display:block;font-size:12.5px;line-height:1.5;color:#4A423A;margin-top:9px}
  .footq{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;align-items:baseline;gap:16px}
  .footq b{font-family:'Fraunces Variable',Georgia,serif;font-size:21px;font-weight:600}
  .footq span{font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--soft);font-weight:700}

  /* ---------- 3 ---------- */
  .vm{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:40px}
  .vm .lbl{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;color:var(--oxide)}
  .vm h3{font-family:'Fraunces Variable',Georgia,serif;font-size:26px;font-weight:600;line-height:1.15;
    margin:10px 0 0;letter-spacing:-.4px}
  .vm p{font-family:'Fraunces Variable',Georgia,serif;font-size:16.5px;line-height:1.64;
    color:#2A241E;margin:14px 0 0}
  .vm p::first-letter{font-family:'Fraunces Variable',Georgia,serif;font-size:44px;line-height:.78;
    float:left;padding:7px 9px 0 0;color:var(--oxide);font-weight:600}
  .qband{position:absolute;left:64px;right:64px;bottom:72px;border-top:1px solid var(--line);
    padding-top:18px;display:flex;align-items:center;gap:18px}
  .qband q{font-family:'Fraunces Variable',Georgia,serif;font-style:italic;font-size:22px;
    color:var(--oxide);quotes:none}
  .qband span{margin-left:auto;font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--soft);font-weight:700}

  /* ---------- 4 ---------- */
  .inv{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
  .boxx{border:1px solid rgba(22,19,15,.24);padding:16px 15px;min-height:106px;
    display:flex;flex-direction:column;justify-content:space-between;background:rgba(255,255,255,.34)}
  .boxx .v{font-family:'Fraunces Variable',Georgia,serif;font-size:33px;font-weight:600;line-height:1}
  .boxx .l{font-size:11px;line-height:1.4;color:rgba(22,19,15,.64);margin-top:10px;letter-spacing:.2px}
  .boxx.hi{background:var(--oxide);border-color:var(--oxide);color:#F7F0E4}
  .boxx.hi .l{color:rgba(255,255,255,.82)}
  .boxx.gr{background:var(--forest);border-color:var(--forest);color:#EFE8DB}
  .boxx.gr .l{color:rgba(239,232,219,.75)}
  .invnote{margin-top:20px;display:flex;gap:14px;align-items:flex-start;font-size:11.5px;
    line-height:1.5;color:var(--soft);max-width:780px}
  .invnote i{display:block;width:9px;height:9px;background:var(--oxide);margin-top:4px;flex:none}

  /* ---------- 5 ---------- */
  .day{margin-top:44px;display:flex;align-items:flex-end;gap:48px}
  .day .t{font-family:'Fraunces Variable',Georgia,serif;font-weight:600;font-size:80px;
    line-height:.88;letter-spacing:-3px}
  .day .t small{display:block;font-family:'Archivo Variable',sans-serif;font-size:10px;
    letter-spacing:2px;text-transform:uppercase;color:var(--soft);margin-top:11px;font-weight:700}
  .day .dash{font-family:'Fraunces Variable',Georgia,serif;font-size:40px;color:var(--oxide);
    padding-bottom:26px}
  .ruler{margin-top:34px;position:relative;height:52px}
  .ruler .ln{position:absolute;left:0;right:0;top:0;height:1px;background:rgba(22,19,15,.42)}
  .ruler .tk{position:absolute;left:0;right:0;top:0;height:12px;
    background:repeating-linear-gradient(90deg,rgba(22,19,15,.45) 0 1px,transparent 1px 4.1666%)}
  .ruler .lb{position:absolute;top:20px;font-size:10px;letter-spacing:1.6px;
    text-transform:uppercase;color:var(--soft);font-weight:700}
  .ruler .lb.l{left:0}.ruler .lb.m{left:50%;transform:translateX(-50%)}.ruler .lb.r{right:0}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:48px}
  .three .c{border-top:2px solid var(--ink);padding-top:16px}
  .three .k{font-family:'Fraunces Variable',Georgia,serif;font-size:20px;font-weight:600;line-height:1.2}
  .three p{font-size:13px;line-height:1.6;color:#4A423A;margin:10px 0 0}

  /* ---------- 6 ---------- */
  .ledger{margin-top:34px;border-top:2px solid var(--ink)}
  .lrow{display:grid;grid-template-columns:104px 1fr 250px;gap:28px;padding:20px 0;
    border-bottom:1px solid var(--line);align-items:baseline}
  .lrow .y{font-family:'Fraunces Variable',Georgia,serif;font-size:24px;font-weight:600;color:var(--oxide)}
  .lrow h4{font-family:'Fraunces Variable',Georgia,serif;font-size:24px;font-weight:600;
    line-height:1.15;margin:0;letter-spacing:-.3px}
  .lrow .d{font-size:13px;line-height:1.55;color:#4A423A;margin:7px 0 0;max-width:640px}
  .lrow .g{font-size:9.5px;letter-spacing:1.7px;text-transform:uppercase;
    color:rgba(22,19,15,.46);font-weight:700;text-align:right}

  /* ---------- 7 ---------- */
  .chart{display:grid;grid-template-columns:1fr 300px;gap:52px;margin-top:30px;align-items:start}
  .plot svg{display:block;width:100%;height:auto}
  .plot .axis{font-family:'Archivo Variable',sans-serif;font-size:11px;fill:rgba(22,19,15,.45)}
  .plot .val{font-family:'Fraunces Variable',Georgia,serif;font-size:15px;font-weight:600;fill:#16130F}
  .plot .yr{font-family:'Archivo Variable',sans-serif;font-size:11.5px;font-weight:700;fill:rgba(22,19,15,.5)}
  .tbl{border-top:2px solid var(--ink)}
  .tbl .r{display:flex;justify-content:space-between;gap:14px;padding:11px 0;
    border-bottom:1px solid var(--line);font-size:12.5px;color:#3D362F}
  .tbl .r b{font-family:'Fraunces Variable',Georgia,serif;font-size:16px;font-weight:600;color:var(--ink)}
  .tbl .lead{font-family:'Fraunces Variable',Georgia,serif;font-size:56px;font-weight:600;
    line-height:.9;letter-spacing:-2px;margin:0 0 6px}
  .tbl .cap{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--oxide);
    font-weight:700;margin-bottom:14px}
  .disc{position:absolute;left:64px;right:64px;bottom:64px;font-size:10px;line-height:1.55;
    color:rgba(22,19,15,.42);border-top:1px solid var(--line);padding-top:10px}

  /* ---------- 8 ---------- */
  .end{padding:0}
  .end .inner{position:absolute;left:64px;top:72px;width:660px}
  .end h2{font-family:'Fraunces Variable',Georgia,serif;font-weight:600;font-size:62px;
    line-height:1.0;letter-spacing:-2px;margin:20px 0 0;color:#F6F0E4}
  .end h2 em{font-style:italic;font-weight:500;color:#E8B9A5}
  .end .rows{margin-top:34px;border-top:1px solid rgba(239,232,219,.22)}
  .end .r{display:grid;grid-template-columns:118px 1fr;gap:18px;padding:13px 0;
    border-bottom:1px solid rgba(239,232,219,.14)}
  .end .r .k{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
    color:rgba(239,232,219,.5);font-weight:700;padding-top:3px}
  .end .r .v{font-size:14px;line-height:1.5;color:#F0E9DC}
  .end .r .v small{display:block;font-size:11.5px;color:rgba(239,232,219,.6);margin-top:2px}
  .end .card{position:absolute;right:64px;top:96px;width:330px;
    border:1px solid rgba(239,232,219,.28);padding:24px;text-align:center;background:rgba(0,0,0,.14)}
  .end #qr{display:inline-block;background:#fff;padding:8px;line-height:0}
  .end #qr img,.end #qr canvas{display:block;width:160px!important;height:160px!important}
  .end .card .c1{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;
    color:rgba(239,232,219,.6);font-weight:700;margin-top:16px}
  .end .card .c2{font-family:'Fraunces Variable',Georgia,serif;font-size:17px;color:#F6F0E4;margin-top:6px}
  .end .thx{position:absolute;left:64px;bottom:32px;font-family:'Fraunces Variable',Georgia,serif;
    font-style:italic;font-size:16px;color:rgba(239,232,219,.55)}

  /* ================= ALT ÇUBUK ================= */
  .tbar{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:60;display:flex;
    align-items:center;gap:12px;padding:0 14px;background:var(--bar);
    border-top:1px solid var(--barline);color:var(--barfg)}
  .grp{display:flex;align-items:center;gap:6px}
  .nb{width:34px;height:34px;border:1px solid #3C352E;border-radius:3px;background:#241F1B;
    color:#D8CEC0;font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0}
  .nb:hover:not(:disabled){background:var(--oxide);border-color:var(--oxide);color:#fff}
  .nb:disabled{opacity:.28;cursor:default}
  .cnt{font-family:'Fraunces Variable',Georgia,serif;font-size:13px;letter-spacing:1.2px;
    color:#8D8375;min-width:52px;text-align:center}
  .cnt b{color:#F6F0E4;font-size:15px;font-weight:600}
  .prog{flex:1;height:4px;border-radius:2px;background:#332C26;overflow:hidden;min-width:40px}
  .prog i{display:block;height:100%;width:12.5%;background:var(--oxide);transition:width .3s}
  .lng{display:flex;background:#241F1B;border:1px solid #3C352E;border-radius:3px;padding:2px}
  .lng button{background:none;border:0;color:#8D8375;font:inherit;font-size:10.5px;font-weight:800;
    letter-spacing:.9px;padding:6px 9px;border-radius:2px;cursor:pointer}
  .lng button[aria-pressed="true"]{background:#F4EEE4;color:var(--forest)}
  .tb{font:inherit;font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
    color:#B9AE9F;background:none;border:1px solid #3C352E;border-radius:3px;padding:0 11px;
    height:34px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .tb:hover{background:#241F1B;color:#F6F0E4}
  .tb.on{background:var(--oxide);border-color:var(--oxide);color:#fff}
  .tb .ic{font-size:13px;line-height:1}

  /* ================= PANELLER ================= */
  .scrim{position:fixed;inset:0;background:rgba(10,8,6,.62);z-index:70;display:none}
  .scrim.open{display:block}
  .panel{position:fixed;z-index:80;background:#0F0D0B;border:1px solid #302A24;color:#DDD3C4;
    box-shadow:0 24px 60px rgba(0,0,0,.7);display:none}
  .panel.open{display:block}

  #notes{left:0;right:0;bottom:64px;max-height:46vh;overflow:auto;padding:18px 20px;
    border-left:0;border-right:0;border-bottom:0}
  #notes .nh{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--oxide);
    font-weight:800;margin-bottom:9px}
  #notes .nt{font-size:15px;line-height:1.65;color:#E2D8C9}
  #notes .nk{margin-top:11px;font-size:11px;color:#7E7365}

  #toc{left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);
    padding:16px;border-radius:6px}
  #toc .th{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  #toc .th b{font-family:'Fraunces Variable',Georgia,serif;font-size:15px;letter-spacing:1.2px;
    color:#F4EEE4}
  #toc .th button{background:none;border:0;color:#8D8375;font-size:20px;cursor:pointer;line-height:1}
  #toc ol{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-height:62vh;overflow:auto}
  #toc li button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:none;
    border:1px solid transparent;border-radius:4px;padding:9px 11px;color:#C9BFAF;font:inherit;
    font-size:13.5px;cursor:pointer}
  #toc li button:hover{background:#1A1613;border-color:#302A24;color:#F4EEE4}
  #toc li button.cur{background:var(--forest);border-color:var(--forest);color:#F4EEE4}
  #toc li .n{font-family:'Fraunces Variable',Georgia,serif;font-size:12px;color:var(--oxide);
    min-width:15px}
  #toc li button.cur .n{color:#E8B9A5}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  @media (max-width:900px){
    .tbar{gap:8px;padding:0 9px;height:58px}
    .stage{bottom:58px}
    #notes{bottom:58px}
    .tb{height:32px;padding:0 8px;letter-spacing:.6px;font-size:10px}
    .tb .lbl{display:none}
    .cnt{min-width:42px;font-size:12px}
    .prog{display:none}
    .nb{width:31px;height:31px}
  }
  @media (max-width:560px){
    .lng button{padding:5px 6px;font-size:10px}
  }

  /* ---------- yazdırma ---------- */
  @media print{
    @page{size:338.7mm 190.5mm;margin:0}
    html,body{overflow:visible;background:#fff;height:auto}
    .tbar,.panel,.scrim{display:none!important}
    .stage{position:static;display:block;padding:0;overflow:visible}
    .box{width:1280px!important;height:auto!important;box-shadow:none}
    .deck{position:static;transform:none!important;width:1280px;height:auto}
    .slide{position:relative;width:1280px;height:720px;opacity:1!important;visibility:visible!important;
      transform:none!important;break-after:page;page-break-after:always}
    .slide:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body data-lang="en">

<div class="stage">
  <div class="box" id="box">
    <div class="deck" id="deck">

      <!-- ============ 1 · COVER ============ -->
      <section class="slide cover dark on">
        <div class="grid">
          <div class="stamp">
            <span class="sq"></span>
            <div class="mt" data-en="Republic of Türkiye · Ministry of National Education<b>Adana · Yüreğir</b>"
                 data-tr="T.C. Millî Eğitim Bakanlığı<b>Adana · Yüreğir</b>"></div>
          </div>

          <h1 data-en="Where education<br>turns into <em>love.</em>"
              data-tr="Eğitimin sevgiye<br>dönüştüğü <em>yer.</em>"></h1>

          <div class="rl"></div>
          <div class="sn" data-en="Yüreğir Halıcılar Anatolian High School"
               data-tr="Yüreğir Halıcılar Anadolu Lisesi"></div>
          <div class="sn2" data-en="Anatolian High School · school profile"
               data-tr="Anadolu Lisesi · okul profili"></div>
        </div>

        <div class="yr">
          <div class="a">2026—2027</div>
          <div class="b" data-en="Adana · Türkiye" data-tr="Adana · Türkiye"></div>
        </div>

        <div class="art">
          <svg viewBox="0 0 400 400" aria-hidden="true">
            <defs>
              <pattern id="ht1" width="7" height="7" patternUnits="userSpaceOnUse">
                <circle cx="3.5" cy="3.5" r="1.7" fill="#E8B9A5"/>
              </pattern>
            </defs>
            <circle cx="200" cy="200" r="168" fill="none" stroke="#E8B9A5" stroke-width="1" opacity=".45"/>
            <circle cx="200" cy="200" r="132" fill="#B5472B" opacity=".9"/>
            <circle cx="200" cy="200" r="132" fill="url(#ht1)" opacity=".55"/>
            <circle cx="200" cy="200" r="96" fill="#14382F"/>
            <circle cx="200" cy="200" r="60" fill="none" stroke="#EFE8DB" stroke-width="1.2" opacity=".65"/>
            <path d="M200 8v384M8 200h384" stroke="#EFE8DB" stroke-width=".8" opacity=".22"/>
          </svg>
        </div>

        <div class="hint" data-en="← → slides · C contents · F full screen"
             data-tr="← → slayt · C içindekiler · F tam ekran"></div>
        <div class="pg"><b>01</b> — 08</div>
      </section>
